keys:
  # メインシステムのage鍵
  - &main age1ylw8czsr7pmme7tlvvz4qaplx8t3gjn6lrfj9gu5tah7r20e3djsq6qyye
  # raspiのage鍵 (raspi の SSH ホスト鍵から ssh-to-age で導出。
  # 鍵本体はリポジトリに置かず ~/.config/raspi/ に保管し、書き込み後のカードへ注入する)
  - &raspi age1uudq9v79zgr8ruh5aj7a8v9mlw5yeae9gr55guynapznmtckhuhsh5llna

creation_rules:
  - path_regex: secrets/raspi/.*\.yaml$
    key_groups:
      - age:
          - *main
          - *raspi
  - path_regex: secrets/.*\.(yaml|env)$
    key_groups:
      - age:
          - *main
