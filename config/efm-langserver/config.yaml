# efm-langserver の設定。
# emacs.d/init.el (lsp-mode) から `efm-langserver -c <このファイル>` で起動される。
version: 2

root-markers:
  - gleam.toml
  - .git/

# 変更のたびに efm-license-lint を起動しないよう、変更通知をまとめてから lint する。
lint-debounce: 500ms

languages:
  # Gleam のマニフェスト (gleam.toml / manifest.toml) の依存行に、
  # そのパッケージのライセンスを診断として表示する。
  # efm-license-lint は Gleam のビルドディレクトリと hex キャッシュのみを読むため、
  # 未取得の依存は warning になる (`gleam deps download` で解消)。
  toml:
    - lint-command: 'efm-license-lint --format efm "$1"'
      # パスを起点にディスクを読むため stdin は不要。
      lint-stdin: false
      lint-formats:
        - '%f:%l:%c:%t:%m'
      lint-source: efm-license-lint
      # 依存が未取得のままでも診断を反映させる。
      lint-ignore-exit-code: true
      # ファイルを開いた時点でも診断を表示する。
      lint-after-open: true
