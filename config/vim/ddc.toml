[[plugins]]
repo = 'Shougo/ddc.vim'
# on_event = ['InsertEnter']
on_event = ['BufRead', 'CursorHold']
# depends = ['denops.vim']
hook_source = '''
call ddc#custom#patch_global('ui', 'pum')
call ddc#custom#patch_global('sources', [
\  'vim-lsp',
\  'around',
\  'vsnip',
\  'denippet',
\  'file',
\  'shell-native',
\  'skkeleton',
\])

call ddc#custom#patch_global('sourceOptions', #{
    \   vim-lsp: #{
    \     matchers: ['matcher_head'],
    \     mark: 'lsp',
    \     forceCompletionPattern: '\.\w*|:\w*|->\w*',
    \   },
    \ })

call ddc#custom#patch_global('sourceOptions', {
\  '_': {
\    'matchers': [ 'matcher_fuzzy' ],
\    'sorters': [ 'sorter_fuzzy' ],
\    'converters': [ 'converter_fuzzy' ],
\    'minAutoCompleteLength': 1,
\  },
\  'around': { 'mark': 'around' },
\  'path': { 'mark': 'P' },
\  'file': {
\    'mark': 'F',
\    'isVolatile': v:true,
\    'forceCompletionPattern': '\S/\S*',
\  },
\  'vsnip': { 'mark': '🧩' },
\  'denippet': { 'mark': '⚡' }
\})

call ddc#custom#patch_global('sourceOptions', {
    \   'skkeleton': {
    \     'mark': ' ',
    \     'matchers': [],
    \     'sorters': [],
    \     'converters': [],
    \     'isVolatile': v:true,
    \     'minAutoCompleteLength': 1,
    \   },
    \ })

call ddc#custom#patch_filetype([ 'ps1', 'dosbatch', 'autohotkey', 'registry' ], {
\   'sourceOptions': {
\     'file': {
\       'forceCompletionPattern': '\S\\\S*',
\     },
\   },
\   'sourceParams': {
\     'file': {
\       'mode': 'win32',
\     },
\   },
\ })


call ddc#custom#patch_global('sourceParams', {
\  'path': {
\     'cmd': [ 'fd', '--max-depth', '5' ],
\   },
\ })


call ddc#enable()

inoremap <C-n>   <Cmd>call pum#map#select_relative(+1)<CR>
inoremap <C-p>   <Cmd>call pum#map#select_relative(-1)<CR>
inoremap <Tab>   <Cmd>call pum#map#confirm()<CR>
inoremap <C-e>   <Cmd>call pum#map#cancel()<CR>
'''

# ddc ui
[[plugins]]
repo = 'Shougo/pum.vim'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-ui-pum'
on_source = 'ddc.vim'

# ddc source
[[plugins]]
repo = "shun/ddc-source-vim-lsp"
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-source-shell-native'
on_source = 'ddc.vim'

[[plugins]]
repo = "uga-rosa/ddc-source-vsnip"
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-around'
on_source = 'ddc.vim'

[[plugins]]
repo = 'LumaKernel/ddc-source-file'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-source-cmdline'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-source-cmdline-history'
on_source = 'ddc.vim'

# ddc sorter
[[plugins]]
repo = 'Shougo/ddc-sorter_rank'
on_source = 'ddc.vim'

# ddc matcher
[[plugins]]
repo = 'Shougo/ddc-matcher_head'
on_source = 'ddc.vim'

[[plugins]]
repo = 'tani/ddc-fuzzy'
on_source = 'ddc.vim'

# Snippet Engine
[[plugins]]
repo = 'hrsh7th/vim-vsnip'
on_source = 'ddc.vim'
hook_source = """
let g:vsnip_filetypes = {}

let g:vsnip_filetypes.javascript = ['javascript']
let g:vsnip_filetypes.typescript = ['typescript', 'javascript']

imap <expr> <C-j>   vsnip#jumpable(1)   ? '<Plug>(vsnip-jump-next)'      : '<C-j>'
smap <expr> <C-j>   vsnip#jumpable(1)   ? '<Plug>(vsnip-jump-next)'      : '<C-j>'
imap <expr> <C-k> vsnip#jumpable(-1)  ? '<Plug>(vsnip-jump-prev)'      : '<C-k>'
smap <expr> <C-k> vsnip#jumpable(-1)  ? '<Plug>(vsnip-jump-prev)'      : '<C-k>'

let g:vsnip_snippet_dirs = [expand("~/.vsnip")]
"""

[[plugins]]
repo = 'rafamadriz/friendly-snippets'

[[plugins]]
repo = 'uga-rosa/denippet.vim'
on_source = 'ddc.vim'
hook_source = """"
for file in glob("~/.denippet/*", ".", 1, 1)
	call denippet#load(file)
endfor
"""

# SKK
[[plugins]]
repo = "vim-skk/skkeleton"
on_source = 'ddc.vim'
hook_source = '''
call skkeleton#azik#add_table("jis")

call skkeleton#config(#{
\   globalDictionaries: [[ "~/.skk-dict/SKK-JISYO.L", "utf-8" ]],
\   databasePath: "~/.skk/database",
\   kanaTable: "azik",
\   eggLikeNewline: v:true
\   })


call skkeleton#register_keymap('henkan', "<", 'purgeCandidate')
call skkeleton#register_keymap('henkan', "X", '')

call skkeleton#register_keymap('henkan', "<S-q>", 'purgeCandidate')
call skkeleton#register_keymap('henkan', "X", '')

call skkeleton#register_keymap('input', ';', 'henkanPoint')


autocmd InsertEnter * ++once call skkeleton#register_kanatable('azik', {
    \   'jj':       'escape',
    \   '@':        'katakana',
    \   '<s-j><s-j>': ['じゅん', ''],
    \   '<s-j>i':     ['じ', ''],
    \   '<s-j>p':     ['じょう', ''],
    \   '<s-j>o':     ['じょ', ''],
    \   '<s-j>k':     ['じん', ''],
    \   '<s-j>u':     ['じゅ', ''],
    \   'l':          ['っ', ''],
    \   'la':         ['', ''],
    \   'li':         ['', ''],
    \   'lu':         ['', ''],
    \   'le':         ['', ''],
    \   'lo':         ['', ''],
    \   'xxa':        ['ぁ', ''],
    \   'xxi':        ['ぃ', ''],
    \   'xxu':        ['ぅ', ''],
    \   'xxe':        ['ぇ', ''],
    \   'xxo':        ['ぉ', ''],
    \   'n':          ['ん', ''],
    \   'z=':         ['＝', ''],
    \   'z~':         ['～', ''],
    \   'z ':         ['　', ''],
    \   'z:':         ['：', ''],
    \ })


imap <C-i> <Plug>(skkeleton-enable)
imap <C-l> <Plug>(skkeleton-disable)
'''

[[plugins]]
repo = 'NI57721/skkeleton-azik-kanatable'
on_source = 'skkeleton'
